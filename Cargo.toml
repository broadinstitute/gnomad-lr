[package]
name = "gnomad-lr"
version = "0.1.0"
edition = "2021"
description = "gnomAD Long Read VCF loader for ClickHouse"

[dependencies]
genohype-core = { path = "../genohype/core", features = ["genomic", "gcp"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
genohype-pool = { path = "../genohype/pool" }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
noodles = { version = "0.91", features = ["vcf", "bgzf", "core", "csi", "tabix"] }
once_cell = "1.19"
urlencoding = "2.1"
flate2 = "1.0"
