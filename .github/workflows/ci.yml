name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8.14.39@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      GNOMAD_LR_Y1_TEST_ENDPOINT: http://127.0.0.1:8123
      GNOMAD_LR_Y1_TEST_DATABASE: gnomad_lr_y1_scratch_ci
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare isolated Y1 integration database
        run: |
          curl --fail --silent --show-error \
            --data-binary 'CREATE DATABASE gnomad_lr_y1_scratch_ci' \
            http://127.0.0.1:8123/

      - name: Verify clean checkout
        run: ./scripts/verify.sh

      - name: Verify Y1 schema and synthetic retry publication
        run: |
          for table in \
            lr_y1_load_runs lr_y1_task_attempts lr_y1_active_partitions \
            lr_y1_rejects_staging lr_y1_summaries_staging \
            lr_y1_alleles_staging lr_y1_frequencies_staging \
            lr_y1_carriers_staging lr_y1_summaries lr_y1_alleles \
            lr_y1_frequencies lr_y1_carriers
          do
            curl --fail --silent --show-error \
              --data-binary "EXISTS TABLE ${table}" \
              'http://127.0.0.1:8123/?database=gnomad_lr_y1_scratch_ci' | grep -qx 1
          done

          curl --fail --silent --show-error \
            --data-binary "SELECT count() > 0 FROM lr_y1_load_runs" \
            'http://127.0.0.1:8123/?database=gnomad_lr_y1_scratch_ci' | grep -qx 1
          curl --fail --silent --show-error \
            --data-binary "SELECT count() FROM lr_y1_active_partitions" \
            'http://127.0.0.1:8123/?database=gnomad_lr_y1_scratch_ci' | grep -qx 0

      - name: Smoke complete ClickHouse schema
        run: |
          curl --fail --silent --show-error \
            --data-binary 'CREATE DATABASE gnomad_lr_ci' \
            http://127.0.0.1:8123/
          target/debug/gnomad-lr init \
            --clickhouse-url 'http://127.0.0.1:8123/?database=gnomad_lr_ci'

          for table in \
            lr_variants lr_haplotypes lr_coverage lr_sample_metadata \
            lr_str_histograms lr_methylation lr_methylation_summary_mv
          do
            curl --fail --silent --show-error \
              --data-binary "EXISTS TABLE ${table}" \
              'http://127.0.0.1:8123/?database=gnomad_lr_ci' | grep -qx 1
          done
